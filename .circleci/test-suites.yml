---
# ============================================================================
# Smarter Testing suites for ssp-platform-monorepo — ONE SUITE PER BUILD UNIT.
#
# WHY THIS FILE IS AT THE REPO ROOT AND NOT IN EACH SUBPACKAGE
# ------------------------------------------------------------
# Each suite is still RUN FROM ITS OWN SUBPACKAGE, exactly as the docs
# require, and no command below uses `cd` or `--directory`:
#
#     cd packages/shared-core && circleci testsuite run "shared-core tests"
#     cd services/api         && circleci testsuite run "api tests"
#     cd services/worker      && circleci testsuite run "worker tests"
#     cd services/web         && circleci testsuite run "web tests"
#
# The CLI walks UP the directory tree to find this file, and the directory it
# finds it in becomes the "project directory" for coverage.
#
# The file cannot live in `services/<name>/.circleci/`. With it there, the
# project directory is the service, and the LCOV data produced by `analysis`
# references `../../packages/shared-core/...`, which escapes it.
# `circleci testsuite doctor` fails with:
#
#   "Analysis command could not locate covered files in the project
#    directory. The coverage data references a file that is outside the
#    project directory: ../../packages/shared-core/src/shared_core/__init__.py"
#
# and instructs you to move this file to the project root. Those cross-package
# coverage edges are the entire point of the monorepo demo, so the root is the
# only workable location. Verified: with the file here, doctor reports
# "N test atoms are impacted by source files" for all four suites.
#
# TWO OTHER THINGS DOCTOR CAUGHT, both fixed elsewhere in the repo:
#   1. `junit_family = xunit1` in every pytest.ini. pytest's default xunit2
#      output omits the <testcase file="..."> attribute, so the CLI cannot map
#      a JUnit result back to the atom that produced it and marks every atom
#      as having no result.
#   2. No re-exports in any package `__init__.py`. An eager __init__ makes
#      every test atom import every module in its package, so all atoms share
#      one coverage footprint and selection degenerates to "run everything"
#      ("Every test atom impacted the same files").
#
# PATH CONVENTIONS
#   - `discover` / `run` / `analysis` run in the SUBPACKAGE, so test atoms are
#     subpackage-relative (`tests/test_pricing.py`).
#   - `full-test-run-paths` are matched against changed files, which are
#     REPO-ROOT relative (`services/api/requirements.txt`).
# ============================================================================
name: shared-core tests

# Every stdout line is read as a test atom, so this lists FILES and must not
# run tests or print metadata. `pytest --collect-only` is unusable here: its
# banner and summary lines would be parsed as atoms.
discover: find tests -type f -name 'test_*.py'

run: pytest --junitxml="<< outputs.junit >>" << test.atoms >>

# LCOV analyses one test atom at a time. Requires coverage.py >= 6.3.
analysis: coverage run -m pytest << test.atoms >> && coverage lcov -o "<< outputs.lcov >>"

options:
  test-impact-analysis: true
  dynamic-test-splitting: true
  # Unique per build unit — suites would otherwise overwrite each other's
  # impact data.
  impact-key: monorepo-shared-core
  full-test-run-paths:
    - packages/shared-core/requirements.txt
    - packages/shared-core/pytest.ini
    - packages/shared-core/.coveragerc
    - packages/shared-core/conftest.py
    - .circleci/*.yml

---
name: api tests

discover: find tests -type f -name 'test_*.py'

run: pytest --junitxml="<< outputs.junit >>" << test.atoms >>

analysis: coverage run -m pytest << test.atoms >> && coverage lcov -o "<< outputs.lcov >>"

options:
  test-impact-analysis: true
  dynamic-test-splitting: true
  impact-key: monorepo-api
  full-test-run-paths:
    - services/api/requirements.txt
    - services/api/pytest.ini
    - services/api/.coveragerc
    - services/api/conftest.py
    - .circleci/*.yml
  # packages/shared-core is deliberately NOT listed here. Coverage sees those
  # edges for real, so impact analysis can select the subset of atoms that
  # actually touch shared-core (tests/test_errors.py, for one, does not).
  # Listing it would force a full run and throw that precision away.
  test-selection-rules:
    # Coverage cannot express "this is the service contract check".
    - test-atom: tests/test_api_smoke.py
      include: true

---
name: worker tests

discover: find tests -type f -name 'test_*.py'

run: pytest --junitxml="<< outputs.junit >>" << test.atoms >>

analysis: coverage run -m pytest << test.atoms >> && coverage lcov -o "<< outputs.lcov >>"

options:
