  dynamic-test-splitting: true
  impact-key: monorepo-worker
  full-test-run-paths:
    - services/worker/requirements.txt
    - services/worker/pytest.ini
    - services/worker/.coveragerc
    - services/worker/conftest.py
    - .circleci/*.yml
  test-selection-rules:
    - test-atom: tests/test_worker_pipeline.py
      include: true

---
name: web tests

discover: find tests -type f -name 'test_*.py'

run: pytest --junitxml="<< outputs.junit >>" << test.atoms >>

analysis: coverage run -m pytest << test.atoms >> && coverage lcov -o "<< outputs.lcov >>"

options:
  test-impact-analysis: true
  dynamic-test-splitting: true
  impact-key: monorepo-web
  full-test-run-paths:
    - services/web/requirements.txt
    - services/web/pytest.ini
    - services/web/.coveragerc
    - services/web/conftest.py
    - .circleci/*.yml
  test-selection-rules:
    - test-atom: tests/test_web_rendering.py
      include: true
