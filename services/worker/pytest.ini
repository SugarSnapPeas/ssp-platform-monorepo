[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra

# REQUIRED by CircleCI Smarter Testing. The default xunit2 family omits the
# `file` attribute on <testcase>, so the testsuite CLI cannot map a JUnit
# result back to the test atom it came from and reports every atom as having
# no result. xunit1 restores file=/line=. Verified with `circleci testsuite
# doctor "ci tests"`.
junit_family = xunit1
